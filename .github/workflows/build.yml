name: Build APK
on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
      - name: Setup project
        run: |
          flutter create --org com.demontv --project-name demon_tv_plus tmp_app
          cp -r tmp_app/android .
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          # Actualizar kotlin version
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.25'/" android/build.gradle || true
          sed -i "s/id 'org.jetbrains.kotlin.android' version .*/id 'org.jetbrains.kotlin.android' version '1.9.25'/" android/settings.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "1.9.25"/' android/settings.gradle || true
          sed -i 's/signingConfig = signingConfigs.debug/signingConfig = signingConfigs.release/' android/app/build.gradle
          sed -i '/buildTypes {/i\    signingConfigs { release { def p=new Properties(); p.load(new FileInputStream(rootProject.file("key.properties"))); storeFile file(p["storeFile"]); storePassword p["storePassword"]; keyAlias p["keyAlias"]; keyPassword p["keyPassword"] } }' android/app/build.gradle
          rm -rf tmp_app
          # Permiso internet
          sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/><uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\"\/>\n    <uses-feature android:name="android.software.leanback" android:required="false"\/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"\/>/' android/app/src/main/AndroidManifest.xml
          # Network security config
          mkdir -p android/app/src/main/res/xml
          python3 -c "open('android/app/src/main/res/xml/network_security_config.xml','w').write('<network-security-config><base-config cleartextTrafficPermitted=\"true\"><trust-anchors><certificates src=\"system\"/></trust-anchors></base-config></network-security-config>')"
          sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config"/' android/app/src/main/AndroidManifest.xml
          # TV launcher
          python3 -c "c=open('android/app/src/main/AndroidManifest.xml').read();p='<provider android:name=\"androidx.core.content.FileProvider\" android:authorities=\"com.demontv.demon_tv_plus.fileprovider\" android:exported=\"false\" android:grantUriPermissions=\"true\"><meta-data android:name=\"android.support.FILE_PROVIDER_PATHS\" android:resource=\"@xml/file_paths\"/></provider>';open('android/app/src/main/AndroidManifest.xml','w').write(c.replace('</application>',p+'</application>')) if 'FileProvider' not in c else None"
          mkdir -p android/app/src/main/res/xml && echo '<paths><external-files-path name="external_files" path="."/><files-path name="files" path="."/><external-path name="external" path="."/></paths>' > android/app/src/main/res/xml/file_paths.xml
          python3 -c "c=open('android/app/src/main/AndroidManifest.xml').read();open('android/app/src/main/AndroidManifest.xml','w').write(c.replace('<action android:name=\"android.intent.action.MAIN\"/>','<action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LEANBACK_LAUNCHER\"/>')) if 'LEANBACK' not in c else None"
          python3 -c "c=open('android/app/src/main/AndroidManifest.xml').read();open('android/app/src/main/AndroidManifest.xml','w').write(c.replace('<application','<application android:banner=\"@drawable/tv_banner\"')) if 'tv_banner' not in c else None"
      - name: Copy app icon
        run: |
          # Eliminar icono vectorial y usar PNG
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          mkdir -p android/app/src/main/res/drawable
          cp android_icons/tv_banner.png android/app/src/main/res/drawable/tv_banner.png
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          # TV Banner
          mkdir -p android/app/src/main/res/drawable
          cp android_icons/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp android_icons/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android_icons/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android_icons/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android_icons/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android_icons/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp android_icons/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp android_icons/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp android_icons/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp android_icons/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Set version
        run: python3 -c "import re,subprocess; v=subprocess.check_output(['grep','version:','pubspec.yaml']).decode().split('+')[0].split()[-1]; c=open('lib/services/update_checker.dart').read(); c=re.sub(r\"static const _currentVersion = '[^']*'\",f\"static const _currentVersion = '{v}'\",c); open('lib/services/update_checker.dart','w').write(c)"
      - run: flutter pub get
      - name: Debug gradle
        run: cat android/app/build.gradle | grep -A5 "buildTypes\|signingConfig"
      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/demontv.keystore
          printf "storePassword=${{ secrets.KEYSTORE_PASSWORD }}\nkeyPassword=${{ secrets.KEY_PASSWORD }}\nkeyAlias=${{ secrets.KEY_ALIAS }}\nstoreFile=demontv.keystore\n" > android/key.properties
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
        env:
          KEYSTORE_PATH: android/app/demontv.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: demontv-plus-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Get app version
        id: appversion
        run: echo "VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.appversion.outputs.VERSION }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
