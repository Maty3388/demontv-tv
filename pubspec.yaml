name: demon_tv_plus
description: DemonTv Plus - App de Streaming
version: 3.1.5+177
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  wakelock_plus: ^1.1.4
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  http: ^1.1.0
  url_launcher: ^6.2.5
  dio: ^5.4.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  android_intent_plus: ^4.0.3
  provider: ^6.1.1
  cached_network_image: ^3.3.0
  carousel_slider: ^4.2.1
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon_app.png"
  min_sdk_android: 21

dependency_overrides:
  package_info_plus: ^8.0.0
  screen_brightness_android: 2.0.0
